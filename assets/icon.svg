<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- App-Icon „Wechsel“ im macOS-Raster: Fläche 824×824 bei 100/100 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fa898"/>
      <stop offset="1" stop-color="#1c635b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdeee8"/>
      <stop offset="1" stop-color="#9fd8ce"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b2e2a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>

  <g filter="url(#soft)">
    <!-- Monitor -->
    <rect x="340" y="262" width="260" height="164" rx="24" fill="#ffffff"/>
    <rect x="358" y="280" width="224" height="120" rx="12" fill="url(#screen)"/>
    <rect x="458" y="424" width="24" height="48" fill="#ffffff"/>
    <!-- Tischplatte -->
    <rect x="250" y="470" width="440" height="46" rx="18" fill="#ffffff"/>
    <!-- Hubsäule (teleskopisch) -->
    <rect x="438" y="514" width="64" height="96" fill="#ffffff"/>
    <rect x="450" y="608" width="40" height="110" fill="#e4f5f2"/>
    <!-- Fuß -->
    <rect x="336" y="712" width="268" height="36" rx="18" fill="#ffffff"/>
    <!-- Auf/Ab -->
    <path d="M760 532 L800 588 L720 588 Z" fill="#c4f1e8" stroke="#c4f1e8" stroke-width="10" stroke-linejoin="round"/>
    <path d="M720 632 L800 632 L760 688 Z" fill="#c4f1e8" stroke="#c4f1e8" stroke-width="10" stroke-linejoin="round"/>
  </g>
</svg>
